version: 2

models:
  - name: int_bike__customers
    description: >
      Customer dimension enriched with lifetime revenue, total quantity purchased,
      and distinct items ordered.
    columns:
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Customer full name"
        tests:
          - not_null
      - name: total_revenue_customer
        description: "Total net revenue generated by the customer across all orders"
      - name: total_quantity_customer
        description: "Total units purchased by the customer"
      - name: nb_diff_items_customer
        description: "Number of distinct items ordered by the customer"

  - name: int_bike__products
    description: >
      Product dimension enriched with category, brand, and total stock across all stores.
    columns:
      - name: product_id
        description: "Unique identifier for the product"
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Product category name"
        tests:
          - not_null
      - name: brand_name
        description: "Product brand name"
        tests:
          - not_null
      - name: total_stock
        description: "Total units in stock across all stores (0 if no stock record)"

  - name: int_bike__stores
    description: >
      Store dimension enriched with total and active staff headcount.
    columns:
      - name: store_id
        description: "Unique identifier for the store"
        tests:
          - unique
          - not_null
      - name: store_name
        description: "Store name"
        tests:
          - not_null
      - name: nb_staff
        description: "Total number of staff members assigned to the store"
      - name: nb_staff_active
        description: "Number of currently active staff members"

  - name: int_bike__orders
    description: >
      Order-level aggregation: total revenue, total quantity, and distinct items per order.
      Joins from order_items.
    columns:
      - name: order_id
        description: "Unique identifier for the order"
        tests:
          - unique
          - not_null
      - name: total_revenue_order
        description: "Total net revenue for the order"
        tests:
          - not_null
      - name: total_quantity_order
        description: "Total units ordered"
      - name: nb_diff_items_order
        description: "Number of distinct items in the order"
