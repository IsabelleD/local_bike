version: 2

models:
  - name: int_bike__customers
    description: >
      Customer dimension enriched with revenue, total quantity purchased
      and distinct items ordered.
    columns:
      - name: customer_id
        description: Unique identifier for the customer
        tests:
          - unique
          - not_null
      - name: full_name
        description: Concatenation of first and last name
        tests:
          - not_null
      - name: street
        description: Street address of the customer
      - name: city
        description: City of the customer
      - name: state
        description: State of the customer (code)
      - name: zip_code
        description: Postal zip code of the customer
      - name: total_revenue_customer
        description: Total net revenue generated by the customer for all orders (0 if no orders)
        tests:
          - not_null
      - name: total_quantity_customer
        description: Total units purchased by the customer for all orders (0 if no orders)
        tests:
          - not_null
      - name: nb_diff_items_customer
        description: Number of distinct items ordered by the customer for all orders (0 if no orders)
        tests:
          - not_null

  - name: int_bike__products
    description: >
      Product dimension enriched with category, brand, and total stock in all stores.
    columns:
      - name: product_id
        description: Unique identifier for the product
        tests:
          - unique
          - not_null
      - name: product_name
        description: Full product name
        tests:
          - not_null
      - name: model_year
        description: Model year of the product
        tests:
          - not_null
      - name: list_price
        description: Real price of the product
        tests:
          - not_null
      - name: category_id
        description: Foreign key to categories
        tests:
          - not_null
      - name: category_name
        description: Product category name
        tests:
          - not_null
      - name: brand_id
        description: Foreign key to brands
        tests:
          - not_null
      - name: brand_name
        description: Product brand name
        tests:
          - not_null
      - name: total_stock
        description: Total units in stock in all stores (0 if no stock record)
        tests:
          - not_null

  - name: int_bike__stores
    description: >
      Store dimension enriched with total and active staff headcount.
    columns:
      - name: store_id
        description: Unique identifier for the store
        tests:
          - unique
          - not_null
      - name: store_name
        description: Name of the store
        tests:
          - not_null
      - name: city
        description: City where the store is located
      - name: state
        description: State where the store is located (code)
      - name: email
        description: Store email address
      - name: nb_staff
        description: Total number of staff members assigned to the store
        tests:
          - not_null
      - name: nb_staff_active
        description: Number of currently active staff members
        tests:
          - not_null

  - name: int_bike__orders
    description: >
      Order-level aggregation: total revenue, total quantity, and distinct items per order.
    columns:
      - name: order_id
        description: Unique identifier for the order
        tests:
          - unique
          - not_null
      - name: total_revenue_order
        description: Total net revenue for the order (sum of line item revenues)
        tests:
          - not_null
      - name: total_quantity_order
        description: Total units ordered across all line items
        tests:
          - not_null
      - name: nb_diff_items_order
        description: Number of distinct items (products) in the order
        tests:
          - not_null
